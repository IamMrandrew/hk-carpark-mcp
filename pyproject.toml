[project]
name = "personal-parking-mcp"
version = "0.1.0"
description = "Thin authenticated MCP tools for Hong Kong government parking data"
requires-python = ">=3.11,<3.15"
dependencies = [
    "mcp==1.30.0",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
    "fastmcp==3.4.7",
    "py-key-value-aio[disk]==0.4.6",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hkparking"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
